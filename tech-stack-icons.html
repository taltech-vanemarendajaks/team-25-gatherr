<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tech Stack Icons</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fff;
      font-family: system-ui, sans-serif;
      padding: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 24px;
    }
    .icon-card {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
    }
    .icon-card img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }
    @media print {
      body { padding: 20px; }
      .icon-card { break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="grid">

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" alt="React" />
  </div>

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg" alt="TypeScript" />
  </div>

  </div>

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/tailwindcss/tailwindcss-original.svg" alt="Tailwind" />
  </div>

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/axios/axios-plain.svg" alt="Axios" />
  </div>

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/google/google-original.svg" alt="Google" />
  </div>

  <div class="icon-card">
    <img src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/vitest.svg" alt="Vitest" />
  </div>

  <div class="icon-card">

  <div class="icon-card">

</html>
